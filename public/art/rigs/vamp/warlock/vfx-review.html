<!doctype html><html lang="en"><meta charset="utf-8"><title>Warlock VFX review</title><style>body{background:#18232c;color:#f0e6cc;font:18px system-ui;padding:24px}main{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}article{background:#2b3c4a;text-align:center;border:1px solid #526777}canvas{width:100%}p{max-width:900px}</style><h1>Warlock — independent effect animations</h1><p>Four matching effect clips. Preview loops for review; game bindings follow the existing unit kit.</p><main></main><script>
Promise.all([fetch('vfx.json').then(r=>r.json()),new Promise((res,rej)=>{let im=new Image;im.onload=()=>res(im);im.onerror=rej;im.src='vfx.png';})]).then(([m,im])=>{let views=[];for(const [name,clip]of Object.entries(m.clips)){let el=document.createElement('article');el.innerHTML='<h2>'+name+'</h2><canvas width="240" height="240"></canvas>';document.querySelector('main').append(el);views.push([el.querySelector('canvas'),clip]);}window.vfxLoaded=true;function tick(t){for(const [canvas,clip]of views){let ctx=canvas.getContext('2d');ctx.clearRect(0,0,240,240);let f=Math.min(7,Math.floor((t%(clip.durationMs+300))/clip.durationMs*8));let r=clip.sourceRects[f];ctx.drawImage(im,...r,10,10,220,220);}requestAnimationFrame(tick);}requestAnimationFrame(tick);});
</script></html>
