<!doctype html><base href="/"><style>body{background:#253c32;color:white;font:16px system-ui}.r{display:flex;gap:5px;margin:5px}.c{background:repeating-conic-gradient(#333 0% 25%,#555 0% 50%) 50%/20px 20px}canvas{width:192px;height:192px}</style><main id="main"></main><script>
const all=[];window.ready=(async()=>{for(const k of ['bonecolossus','deathknight','plaguelord','wisp']){const m=await fetch('art/rigs/undead/'+k+'/vfx.json').then(r=>r.json());const im=new Image();im.src='art/rigs/undead/'+k+'/'+m.file;await im.decode();const h=document.createElement('h2');h.textContent=k;main.append(h);const row=document.createElement('div');row.className='r';main.append(row);for(const [name,c]of Object.entries(m.clips)){const d=document.createElement('div');d.innerHTML=name+'<br><canvas class="c" width="256" height="256"></canvas>';row.append(d);all.push({im,c,canvas:d.querySelector('canvas')});}}})();function tick(t){for(const o of all){const c=o.canvas.getContext('2d');c.clearRect(0,0,256,256);const r=o.c.sourceRects[Math.floor(t/120)%6];c.drawImage(o.im,...r,0,0,256,256);}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script>
