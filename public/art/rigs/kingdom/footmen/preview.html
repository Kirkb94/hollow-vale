<!doctype html><meta charset="utf-8"><base href="/"><title>Kingdom rig assembly audit</title><style>body{margin:20px;background:#202735;color:#efe6c9;font:15px system-ui}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.card{background:#303c49;text-align:center}canvas{width:100%;max-width:220px}button{padding:8px;margin:4px}h2{margin-top:30px}</style><h1>Kingdom directional rig validation</h1><div id="buttons"></div><main id="units"></main><script src="rig-animation.js"></script><script>
const keys=['footmen','bowmen','raiders','lookout','marshal'];let state='idle';const cards=[];
for(const v of ['idle','walk','attack','shoot','thrust','cast','hurt','death']){let b=document.createElement('button');b.textContent=v;b.onclick=()=>state=v;buttons.append(b);}
window.previewReady=(async()=>{await HVRig.ready;for(const k of keys){await HVRig.register(k,{folder:'kingdom/'+k,manifest:'manifest.json'});const h=document.createElement('h2');h.textContent=k;units.append(h);const grid=document.createElement('div');grid.className='grid';units.append(grid);for(let d=0;d<6;d++){let el=document.createElement('div');el.className='card';el.innerHTML='<div>'+HVRig.directions[d].toUpperCase()+'</div><canvas width="240" height="240"></canvas>';grid.append(el);cards.push({c:el.querySelector('canvas'),k,d});}}return {failures:HVRig.failures,loaded:keys.filter(k=>HVRig.assets.has(k))};})();
function tick(t){for(const o of cards)HVRig.draw(o.c,o.k,o.d,state,t%(state==='death'?1400:1000),true);requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script>
