<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kingdom Knight — six-direction rig review</title><style>body{background:#18232c;color:#eee6cc;font:16px system-ui;padding:24px}button{padding:12px;background:#31475b;color:white;border:1px solid #a58b51;border-radius:6px;margin-right:8px}main{display:grid;grid-template-columns:repeat(3,minmax(200px,1fr));gap:12px}article{background:#253541;text-align:center;border:1px solid #526777;border-radius:9px}canvas{width:100%;max-width:330px}p{max-width:900px;line-height:1.5}.status{color:#ffd27a}@media(max-width:700px){main{grid-template-columns:repeat(2,minmax(140px,1fr))}}</style><h1>Kingdom Knight — movable pieces</h1><p>Six authored views. Body, cape, head, arms, legs, sword and shield move independently. This review is separate from the live game renderer.</p><nav><button data-state="idle">Idle</button><button data-state="walk">Walk</button><button data-state="attack">Attack</button><button data-state="hurt">Hit reaction</button><button data-state="death">Death</button><button id="pause">Pause</button></nav><p class="status" id="status">Loading...</p><main></main><script>
let mode='idle',st=0,frozen=false,last=0,time=0;const names=['e','se','sw','w','nw','ne'],images={},views=[];
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{mode=b.dataset.state;st=time;});document.querySelector('#pause').onclick=()=>{frozen=!frozen;document.querySelector('#pause').textContent=frozen?'Resume':'Pause';};
function img(file){return new Promise((res,rej)=>{let i=new Image;i.onload=()=>res(i);i.onerror=rej;i.src=file;});}
Promise.all([fetch('manifest.json').then(r=>r.json()),...names.map(d=>img(d+'.png')),img('equipment.png')]).then(([m,...ims])=>{names.forEach((d,i)=>{images[d]=ims[i];let el=document.createElement('article');el.innerHTML='<h2>'+d.toUpperCase()+'</h2><canvas width="330" height="360"></canvas>';document.querySelector('main').append(el);views.push({d,c:el.querySelector('canvas')});});images.gear=ims[6];document.querySelector('#status').textContent='72 body pieces + 12 equipment pieces · All six views loaded';window.knightManifest=m;function loop(now){if(!frozen)time+=Math.min(50,now-(last||now));last=now;for(const v of views)draw(v,m,time-st);requestAnimationFrame(loop);}requestAnimationFrame(loop);}).catch(e=>{document.querySelector('#status').textContent='Failed to load: '+e;});
function draw({d,c},m,t){let ctx=c.getContext('2d'),di=names.indexOf(d),sg=[1,1,-1,-1,-1,1][di],back=di>=4,profile=di===0||di===3,w=profile?.8:1;let wave=mode==='walk'?Math.sin(t/110):0,atk=mode==='attack'?Math.pow(Math.sin((t%1200)/1200*Math.PI),3):0,fall=mode==='death'?Math.min(1,t/900):0;
ctx.clearRect(0,0,330,360);ctx.save();ctx.translate(165,315-Math.abs(wave)*3);ctx.scale(1.4,1.4);ctx.rotate(fall*sg*1.45);if(mode==='hurt')ctx.rotate(Math.sin(t/60)*.07*Math.max(0,1-t/600));ctx.globalAlpha=mode==='death'?Math.max(.15,1-t/1800):1;
const part=(name,x,y,pw,ph,a=0,px=.5,py=.08)=>{let p=m.views[d].parts[name],r=p.renderRect;ctx.save();ctx.translate(x,y);ctx.rotate(a);if(p.flipX)ctx.scale(-1,1);ctx.drawImage(images[d],...r,-pw*px,-ph*py,pw,ph);ctx.restore();};
const gear=(name,x,y,pw,ph,a=0)=>{let p=m.equipment.views[d][name];ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.drawImage(images.gear,...p.sourceRect,-pw*p.pivot[0],-ph*p.pivot[1],pw,ph);ctx.restore();};
function leg(left){let n=left?'left':'right',s=wave*(left?1:-1),x=(left?1:-1)*(back?-1:1)*10*w;ctx.save();ctx.translate(x,-62);ctx.rotate(s*.2);part(n+'Leg',0,0,19,47);part(n+'Boot',0,41,26,24,s*.1);ctx.restore();}
function arm(left){let n=left?'left':'right',x=(left?1:-1)*(back?-1:1)*25*w,active=!left,rotation=wave*(left?1:-1)*.2+(active?-sg*atk*1.9:sg*atk*.25);ctx.save();ctx.translate(x,-135);ctx.rotate(rotation);part(n+'UpperArm',0,0,24,35);ctx.translate(0,28);ctx.rotate(active?-sg*atk*.5:0);part(n+'Forearm',0,0,21,34);if(left)gear('shield',0,20,40,53);else gear('sword',0,29,24,72,-sg*.25);ctx.restore();}
const nearLeft=di===2||di===3||di===4;part('cape',0,-148,72*w,126,wave*.025);leg(!nearLeft);arm(!nearLeft);leg(nearLeft);part('torso',0,-145,57*w,68);part('pelvis',0,-89,62*w,54,wave*.035);if(back)part('cape',0,-148,70*w,123,wave*.03);part('head',sg*(profile?4:1),-185,47,50,Math.sin(t/600)*.015);arm(nearLeft);ctx.restore();}
</script></html>
